<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro VCR Front Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --vfd-glow: #00ffd5;
            --vfd-dim: #004d40;
            --vcr-plastic: #1a1a1a;
        }

        body {
            background-color: #121212;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* The VFD Screen Styling */
        .vfd-container {
            background: #050a0a;
            border: 4px solid #000;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        .vfd-text {
            font-family: 'Share Tech Mono', monospace;
            color: var(--vfd-glow);
            text-shadow: 0 0 8px rgba(0, 255, 213, 0.6), 0 0 15px rgba(0, 255, 213, 0.3);
            text-transform: uppercase;
        }

        .vfd-dim {
            color: var(--vfd-dim);
            text-shadow: none;
        }

        /* Bezel and Chassis Effects */
        .chassis {
            background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 10%, #111 100%);
            border-bottom: 3px solid #000;
        }

        /* Glass Reflection */
        .vfd-glass::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="max-w-2xl w-full p-4">
        <!-- VCR Chassis -->
        <div class="chassis rounded-xl p-8 shadow-2xl border-t border-gray-700">
            
            <div class="flex flex-col md:flex-row gap-8 items-center justify-center">
                
                <!-- Center: The VFD Screen -->
                <div class="vfd-container vfd-glass flex-1 min-w-[300px] h-32 rounded-lg p-4 flex flex-col justify-center items-center">
                    <span class="vfd-text text-5xl tracking-widest">PROJECT</span>
                </div>

            </div>

            <!-- Tape Slot Branding -->
            <div class="mt-8 pt-4 border-t border-gray-900 flex justify-between items-center opacity-30">
                <span class="text-white text-[10px] font-serif italic">Hi-Fi Stereo / HQ Video System</span>
                <div class="flex gap-2">
                    <div class="h-1 w-8 bg-gray-600 rounded"></div>
                    <div class="h-1 w-4 bg-gray-600 rounded"></div>
                </div>
            </div>
        </div>

        <!-- Instructions -->
        <div class="mt-6 text-gray-500 text-center text-sm">
            <p>Interactive VFD Component — Click the buttons to simulate VCR states.</p>
        </div>
    </div>

</body>
</html>
